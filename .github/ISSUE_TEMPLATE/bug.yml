name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题
      description: 发生了什么，期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本/提交
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Web
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 请先删除密钥、私人记忆、邮件和个人文件
